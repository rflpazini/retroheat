<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroHeat — what retro games are heating up</title>
    <meta
      name="description"
      content="Daily momentum board for collectible PS2, GameCube, PSP, PS Vita, N64, Dreamcast and Game Boy games. Open source, free, and honest about where the numbers come from."
    />
    <meta name="theme-color" content="#1f4e4c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      try {
        const saved = localStorage.getItem('retroheat-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
