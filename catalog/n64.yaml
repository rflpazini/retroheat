      developer: "Victor Interactive Software"
      publisher: "Natsume"
      year: 1999
      genre: "Farming simulation"
      trivia: "The festival calendar and the villagers' schedules ran whether or not you showed up, which was novel at the time."
      why: "A modest cartridge print run met a series following that kept growing for two decades."
    ebay:
      query: "Harvest Moon 64 N64"
      negative: ["snes", "gameboy", "repro"]
