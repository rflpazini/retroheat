    info:
      developer: "Quest"
      publisher: "Atlus"
      year: 1999
      genre: "Tactical RPG"
      trivia: "Quest's tactical series ran on reputation alone in the West; the N64 entry never had a marketing push."
      why: "A small Atlus print run for a niche strategy game on an expensive cartridge format."
    ebay:
      query: "Ogre Battle 64 N64"
      negative: ["snes", "tactics ogre", "repro"]
