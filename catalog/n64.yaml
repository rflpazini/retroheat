  - id: conkers-bad-fur-day-n64
    title: "Conker's Bad Fur Day"
    info:
      cover_url: "https://upload.wikimedia.org/wikipedia/en/9/99/Conkersbfdbox.jpg"
      developer: "Rare"
      publisher: "Rare"
      year: 2001
      genre: "Platformer"
      trivia: "Rare rebuilt the game from the family-friendly Twelve Tales: Conker 64 into an M-rated comedy after critics said it looked like Banjo-Kazooie."
      why: "Released in March 2001, months before the GameCube, with a small print run and a mature rating that kept it off many shelves."
    ebay:
      query: "Conker's Bad Fur Day N64"
      negative: ["live and reloaded", "xbox", "pocket tales", "repro"]
