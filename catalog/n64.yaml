  - id: conkers-bad-fur-day-n64
    title: "Conker's Bad Fur Day"
    info:
      developer: "Rare"
      publisher: "Rare"
      year: 2001
      genre: "Platformer"
      trivia: "Rare rebuilt the game from the family-friendly Twelve Tales: Conker 64 into an M-rated comedy after critics said it looked like Banjo-Kazooie."
      why: "Released in March 2001, months before the GameCube, with a small print run and a mature rating that kept it off many shelves."
    ebay:
      query: "Conker's Bad Fur Day N64"
      negative: ["live and reloaded", "xbox", "pocket tales", "repro"]
  - id: harvest-moon-64-n64
    title: "Harvest Moon 64"
    info:
      developer: "Victor Interactive Software"
      publisher: "Natsume"
      year: 1999
      genre: "Farming simulation"
      trivia: "The festival calendar and the villagers' schedules ran whether or not you showed up, which was novel at the time."
      why: "A modest cartridge print run met a series following that kept growing for two decades."
    ebay:
      query: "Harvest Moon 64 N64"
      negative: ["snes", "gameboy", "repro"]
