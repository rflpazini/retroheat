name: keepalive

# GitHub disables scheduled workflows in a public repository after 60 days
# without activity. The daily data commit normally counts as activity, so this
# only matters if collection has been failing for two months.
#
# It runs in its own workflow, rather than inside `scrape`, so a third-party
# action never shares a job with the marketplace API secrets.

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit rather than the mutable v1 tag.
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1
        continue-on-error: true
