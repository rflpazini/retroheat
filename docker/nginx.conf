server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # The collector's output is mounted here at run time. It changes far more
    # often than the build, so it must never be served from cache.
    location /data/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app uses hash routing, so every real path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
